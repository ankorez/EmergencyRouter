# Config embarquée dans l'image flashable (premier démarrage).
# Le Wi-Fi du Pi sert uniquement à joindre la 5G partagée du téléphone ; le réseau local passe par Ethernet (eth0).
# Premier accès : brancher un PC ou la borne Wi-Fi sur le switch, puis https://192.168.1.1/
lan:
  address: 192.168.1.1/24
  interface: eth0
  dhcp_start: 192.168.1.100
  dhcp_end: 192.168.1.250
  lease: 12h
  dns: [1.1.1.1, 9.9.9.9]
uplink:
  interface: wlan0
web:
  port: 443                  # HTTPS (certificat auto-signé créé automatiquement)
  http_port: 80                # redirige vers HTTPS (0 pour désactiver)
  tls: true
